# Local platform services. This is not HA and does not include backups.
# Timescale + Mosquitto + Redis; the API and scoring worker still run on the host venv.
services:
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: auravance
      POSTGRES_PASSWORD: auravance
      POSTGRES_DB: auravance
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  timescale-data:
