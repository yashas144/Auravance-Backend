[project]
name = "auravance-backend"
version = "0.1.0"
description = "Backend foundation for Auravance predictive maintenance platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "joblib>=1.4.2",
  "pandas>=2.2.3",
  "paho-mqtt>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=4.3.1",
  "py7zr>=0.22.0",
  "redis>=5.0.0",
  "scikit-learn>=1.5.2",
  "uvicorn[standard]>=0.30.0",
  "xgboost>=2.0.0",
]

[project.optional-dependencies]
sequence = [
  "torch>=2.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
